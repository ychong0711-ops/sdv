name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest mpu/tests/ -v

      - name: Syntax check all Python
        run: |
          set -e
          for f in $(git ls-files '*.py'); do
            python -m py_compile "$f"
          done

  cppcheck-misra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # 결과는 첫 push 후 갱신. "MISRA 0 violations" 주장은 이 job이 통과해야만 사용할 것.
      # --suppress=misra-config: MISRA addon이 C++ 선언부(struct 변수 선언 등)를 파싱하지
      # 못해 발생하는 [misra-config] 오류를 무시. 실제 misra-c2012-* 규칙 위반은 그대로 실패 처리.
      - name: MISRA-C 2012 static analysis (MCU)
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --addon=misra \
                   --suppress=missingIncludeSystem \
                   --suppress=misra-config \
                   --inline-suppr \
                   --error-exitcode=1 \
                   MCU/src

  mcu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zephyr 공식 셋업 액션: west workspace(init/update) + Zephyr SDK 자동 설치.
      # zephyr-build 컨테이너 방식은 checkout EACCES / SDK 미탐지 문제로 대체.
      - uses: docker/setup-zephyr@main
        with:
          sdk-version: 0.16.5-1
          version: main

      - name: Build MCU app
        run: |
          west build -b arduino_uno_q MCU

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile의 빌드 컨텍스트는 repo root (docker/docker-compose.yml의 context: .. 와 일치)
      - name: Build MPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: sdv-mpu:ci
