name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest mpu/tests/ -v

      - name: Syntax check all Python
        run: |
          set -e
          for f in $(git ls-files '*.py'); do
            python -m py_compile "$f"
          done

  cppcheck-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # 참고: MISRA-C 2012 addon은 C 전용 규칙이라 C++(Zephyr) 코드에는 부적합.
      # (cppcheck 2.7 기준: 15.5 단일 종료점, 14.4 if 형식, 8.9 static 명명 등이
      #  Zephyr/임베디드 표준 스타일을 전부 위반으로 보고) 따라서 일반 품질 검사로 전환.
      # README에도 "MISRA 수치 주장" 없이 cppcheck 정적 분석으로 정직하게 표기.
      - name: cppcheck static analysis (MCU)
        run: |
          cppcheck --enable=warning,performance,portability \
                   --suppress=missingIncludeSystem \
                   --inline-suppr \
                   --error-exitcode=1 \
                   MCU/src

      - name: MCU SOME/IP-SD host test (wire format vs Python)
        # someip_sd.cpp 는 Zephyr 무의존 순수 C라 호스트에서 컴파일/실행 가능.
        # Python(mpu/someip/sd.py, pytest 16건 검증) 생성 벡터와 바이트 단위 대조.
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -IMCU/src \
              MCU/tests/test_someip_sd_host.cpp MCU/src/someip_sd.cpp \
              -o /tmp/test_someip_sd
          /tmp/test_someip_sd

  mcu-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      # zephyr-build 이미지는 기본 non-root 사용자로 실행되어 actions/checkout이
      # runner temp 디렉토리에 쓸 수 없어 EACCES로 실패함. root로 실행해 해결.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # 보드 지원이 포함된 Zephyr 릴리스 확인 후 --mr을 태그로 고정 권장.
      # 현재는 upstream main의 arduino_uno_q 보드 정의 사용.
      - name: Init Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr main zephyrproject
          cd zephyrproject
          west update

      - name: Build MCU app
        run: |
          # zephyr-build 컨테이너에 설치된 SDK를 west가 자동으로 못 찾는 경우가 있어
          # ZEPHYR_SDK_INSTALL_DIR을 명시적으로 지정
          ls -d /opt/toolchains/zephyr-sdk-* 2>/dev/null || echo "no /opt/toolchains"
          export ZEPHYR_SDK_INSTALL_DIR=$(ls -d /opt/toolchains/zephyr-sdk-* 2>/dev/null | head -1)
          cd zephyrproject
          west build -b arduino_uno_q ../MCU

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile의 빌드 컨텍스트는 repo root (docker/docker-compose.yml의 context: .. 와 일치)
      - name: Build MPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: sdv-mpu:ci
