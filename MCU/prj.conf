# Zephyr prj.conf - STM32U585 SDV Zone Controller
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=3

# SOME/IP transport:
#   - 기본값: UDP (PC 시뮬레이션, 127.0.0.1:30490)
#   - 실보드(UNO Q): CONFIG_SOMEIP_TRANSPORT_UART=y (LPUART1 터널)
#   - 기본값은 Kconfig(MCU/Kconfig)에서 n으로 정의됨
# CONFIG_SOMEIP_TRANSPORT_UART=n

# CAN-FD
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
# 참고: 필터 수는 최신 Zephyr에서 런타임 API can_get_max_filters()로 조회
# (과거 CONFIG_CAN_MAX_FILTER는 Zephyr main에서 제거됨)

# Networking (SOME/IP over UDP)
CONFIG_NETWORKING=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
# SD(Service Discovery) multicast receive: OfferService 수신을 위해 IGMP 그룹 가입 필요
CONFIG_NET_IPV4_IGMP=y

# Watchdog
CONFIG_WATCHDOG=y

# GPIO
CONFIG_GPIO=y

# Thread
CONFIG_MAIN_STACK_SIZE=2048
