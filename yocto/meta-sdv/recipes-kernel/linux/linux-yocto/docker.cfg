# Docker 데몬 커널 요구사항 (docker.inc RRECOMMENDS kernel-module-xt-addrtype 등)
# docker 브리지 NAT가 iptables addrtype 매치를 사용하므로 모듈로 활성화.
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NF_NAT=m
CONFIG_NF_CONNTRACK_NETLINK=m
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
# docker 컨테이너 bridge 네트워크: veth 쌍 필요
CONFIG_VETH=y
